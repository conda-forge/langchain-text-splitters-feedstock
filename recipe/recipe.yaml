schema_version: 1

context:
  name: langchain-text-splitters
  version: 1.1.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_text_splitters-${{ version }}.tar.gz
  sha256: 929b6c76f99d611a5b1d8f5591ef302909b86a436ceb3217034d24e4757868d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.4.7,<2.0.0
tests:
  - python:
      imports:
        - langchain_text_splitters
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: LangChain text splitting utilities
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain
  repository: https://github.com/langchain-ai/langchain/tree/master/libs/text-splitters

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
